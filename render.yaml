# Render Blueprint: the Giftwise web service, its Postgres database, and the outside checks.
# In the Render Dashboard choose New > Blueprint, pick this repository, and fill in the values marked sync: false.
#
#   giftwise          the web app (Next.js) and its API
#   giftwise-checks   a Render Workflow: one task per check, run in parallel with retries (workflows/)
#   giftwise-nightly  a cron job that starts the checks every night
services:
  - type: web
    name: giftwise
    runtime: node
    plan: starter # 0.5 CPU, 512 MB, always on
    region: oregon
    buildCommand: npm ci && npm run build
    preDeployCommand: npx drizzle-kit push --force # create or update the tables before each release
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    buildFilter:
      ignoredPaths:
        - workflows/**
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: giftwise-db
          property: connectionString
      - key: AUDIT_SALT
        generateValue: true
      - key: CHECKS_SECRET # shared with giftwise-checks, so only the workflow can file results
        generateValue: true
      - key: CHECKS_WORKFLOW_SLUG
        fromService:
          type: workflow
          name: giftwise-checks
          property: slug
      - key: RENDER_API_KEY # lets "Run the checks now" on /judges start the workflow
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_VENDOR_EMAIL
        sync: false
      # Optional: one sandbox business account per sample shop. Unset ones use PAYPAL_VENDOR_EMAIL.
      - key: PAYPAL_VENDOR_EMAIL_RIVERSIDE
        sync: false
      - key: PAYPAL_VENDOR_EMAIL_EASTGATE
        sync: false
      - key: PAYPAL_VENDOR_EMAIL_NORTHSIDE
        sync: false
      - key: PAYPAL_ABLE_EMAIL
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: NEXT_PUBLIC_AG_STUDIO_LICENSE_KEY
        sync: false
      # Optional: each has a working fallback until it is set (sample products; the in-app rulebook search).
      - key: CHANNEL3_API_KEY
        sync: false
      - key: ELASTIC_URL
        sync: false
      - key: ELASTIC_API_KEY
        sync: false

  - type: workflow
    name: giftwise-checks
    runtime: node
    region: oregon
    rootDir: workflows
    buildCommand: npm ci
    startCommand: npm start
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: APP_URL # checked from outside, through the public address, the way a judge sees it
        value: https://giftwise-405i.onrender.com
      - key: CHECKS_SECRET
        fromService:
          type: web
          name: giftwise
          envVarKey: CHECKS_SECRET

  - type: cron
    name: giftwise-nightly
    runtime: node
    region: oregon
    schedule: "0 9 * * *" # 09:00 UTC: 4 AM Eastern, 1 AM Pacific
    rootDir: workflows
    buildCommand: npm ci
    startCommand: npm run trigger
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: CHECKS_WORKFLOW_SLUG
        fromService:
          type: workflow
          name: giftwise-checks
          property: slug
      - key: RENDER_API_KEY
        sync: false

databases:
  - name: giftwise-db
    plan: basic-256mb # 0.1 CPU, 256 MB
    databaseName: giftwise
    user: giftwise
    postgresMajorVersion: "17"
    diskSizeGB: 1
    region: oregon
    ipAllowList: [] # reachable only from services in this Render workspace
